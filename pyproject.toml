[project]
name = "kickstart-platform-checks"
version = "0.1.0"
description = "Repository-level checks for Task 3 (Dockerfiles, Compose, Kubernetes manifests, ARCHITECTURE.md)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "pyyaml", "types-pyyaml", "ruff", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["services"]  # each service has its own pyproject.toml and tool configuration

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC"]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^services/"]  # each service has its own pyproject.toml and mypy configuration

[tool.pytest.ini_options]
testpaths = ["tests"]
